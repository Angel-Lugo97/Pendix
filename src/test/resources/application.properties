spring.application.name=PendixTest

# Base temporal utilizada exclusivamente durante las pruebas
spring.datasource.url=jdbc:h2:mem:pendix_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas al iniciar las pruebas y las elimina al finalizar
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Evita abrir Swagger durante contextLoads()
app.browser.auto-open=false

# Configuración necesaria para crear los componentes JWT
security.jwt.secret=AIFmaNEbHeFtZgnYINZTf2TPWeCz1VF6KhlHyku3cbw=
security.jwt.expiration-ms=3600000
